; Everward Medium Graphics Preset
; Presentation-only scalable profile for modest discrete GPUs / stronger integrated graphics.
; Authoritative simulation/gameplay values MUST NOT be added here.

[ConsoleVariables]
t.MaxFPS=60
r.ScreenPercentage=85

sg.ViewDistanceQuality=1
sg.AntiAliasingQuality=2
sg.ShadowQuality=1
sg.GlobalIlluminationQuality=1
sg.ReflectionQuality=1
sg.PostProcessQuality=1
sg.TextureQuality=2
sg.EffectsQuality=1
sg.FoliageQuality=1
sg.ShadingQuality=1

r.Streaming.PoolSize=1024
r.Streaming.LimitPoolSizeToVRAM=1

r.VolumetricFog=1
r.MotionBlurQuality=1
r.BloomQuality=3
r.DepthOfFieldQuality=1
r.LensFlareQuality=1
