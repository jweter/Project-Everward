; Everward Low-Spec Play Mode
; Development-only presentation profile for constrained hardware.
; Authoritative simulation/gameplay values MUST NOT be added here.
; Launch with the low-spec helper so these CVars are applied as overrides.

[ConsoleVariables]
; Keep the test session responsive and bounded.
t.MaxFPS=30
r.ScreenPercentage=70

; Reduce expensive presentation paths first.
sg.ViewDistanceQuality=0
sg.AntiAliasingQuality=1
sg.ShadowQuality=0
sg.GlobalIlluminationQuality=0
sg.ReflectionQuality=0
sg.PostProcessQuality=0
sg.TextureQuality=1
sg.EffectsQuality=0
sg.FoliageQuality=0
sg.ShadingQuality=0

; Bound shared-memory pressure on integrated graphics.
r.Streaming.PoolSize=512
r.Streaming.LimitPoolSizeToVRAM=1

; Prefer cheaper presentation while preserving gameplay/readability.
r.VolumetricFog=0
r.MotionBlurQuality=0
r.BloomQuality=1
r.DepthOfFieldQuality=0
r.LensFlareQuality=0

; Do not place physics, simulation tick, mining/resource, damage, AI,
; controls, save semantics, detection ranges, or progression CVars here.
