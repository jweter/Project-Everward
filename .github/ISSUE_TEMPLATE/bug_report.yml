name: Bug report
description: Report reproducible incorrect behavior in Everward or its development tooling.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report observed behavior, not speculation. Preserve seeds, save versions, and deterministic reproduction details whenever relevant.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include seed, simulation time, save version, branch/commit, engine/prototype, and exact steps where applicable.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, hardware, engine/runtime version, build configuration, and other relevant details.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, save files, benchmark output, deterministic hashes, or related links.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I checked for an existing issue describing the same problem.
          required: true
        - label: I removed secrets, private credentials, and uncleared third-party material from attachments/logs.
          required: true
