name: Procedural Mechanical Modeling Pilot

on:
  pull_request:
    paths:
      - 'tools/procedural_mechanics/**'
      - 'unreal/Source/Everward/EverwardProbePawn.cpp'
      - 'unreal/Source/Everward/EverwardProbePawn.h'
      - 'docs/PROCEDURAL_MECHANISM_STUDIO.md'
      - '.github/workflows/procedural-mechanics.yml'
  push:
    branches: [main]
    paths:
      - 'tools/procedural_mechanics/**'
      - 'unreal/Source/Everward/EverwardProbePawn.cpp'
      - 'unreal/Source/Everward/EverwardProbePawn.h'
      - 'docs/PROCEDURAL_MECHANISM_STUDIO.md'
      - '.github/workflows/procedural-mechanics.yml'

permissions:
  contents: read

jobs:
  mechanical-bridge-contract:
    name: 3D C++/JS kinematics, modular GLB and Unreal surface contracts
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # C++ oracle compiles directly against this repository's authority,
      # with no external packages, Blender, paid services or browsers.
      - name: JavaScript syntax
        shell: bash
        run: |
          node --check tools/procedural_mechanics/prime-arm/main.js
          node --check tools/procedural_mechanics/prime-arm/model.mjs
          node --check tools/procedural_mechanics/prime-arm/export_glb.mjs
      - name: Run independent C++/JS 3D parity and GLB tests
        run: node --test tools/procedural_mechanics/prime-arm/*.test.mjs
      - name: Check Unreal optional asset integration contract
        run: python tools/procedural_mechanics/prime-arm/test_unreal_bridge_surface.py
      - name: Preserve existing scan, mining, inventory and Fix_It source contracts
        shell: bash
        run: |
          python tools/test_phase2_scan_to_mining_surface.py
          python tools/test_phase2_material_inventory_surface.py
          python tools/test_phase2_fix_it_playable_unreal.py
