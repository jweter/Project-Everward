name: Golden Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    name: probe-survival-loop-v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run golden verification
        run: python engineering/run_verification.py --lane probe_survival_loop_v1
