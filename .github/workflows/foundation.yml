name: Foundation checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-constitution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate repository foundation
        run: python tools/check_foundation.py

      - name: Validate canonical Prime Probe reference assets
        run: python tools/validate_reference_assets.py

      - name: Build production simulation core
        run: cmake -S src/simulation -B build/simulation -DCMAKE_BUILD_TYPE=Release

      - name: Compile production simulation core
        run: cmake --build build/simulation --parallel 2

      - name: Test production simulation core
        run: ctest --test-dir build/simulation --output-on-failure

      - name: Test repository foundation validation tooling
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Test deterministic simulation clock prototype
        run: python -m unittest discover -s prototypes/simulation-clock -p 'test_*.py' -v

      - name: Test procedural system prototype
        run: python -m unittest discover -s prototypes/procedural-system -p 'test_*.py' -v

      - name: Test coordinate scale prototype
        run: python -m unittest discover -s prototypes/coordinate-scale -p 'test_*.py' -v

      - name: Test headless simulation prototype
        run: python -m unittest discover -s prototypes/headless-simulation -p 'test_*.py' -v

      - name: Test rendering benchmark evidence contract
        run: python -m unittest discover -s prototypes/rendering-benchmark -p 'test_*.py' -v

      - name: Test Phase 1 exit gate audit
        run: python -m unittest discover -s prototypes -p 'test_*.py' -t prototypes -v
